name: Auto Release

concurrency:
  # Serialize real releases: a later workflow completion must not cancel a run
  # between its release commit, tag, and downstream publishing dispatch.
  group: auto-release-${{ github.repository }}-main${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '-dry-run' || '' }}
  cancel-in-progress: false
  queue: max

on:
  # workflow_run is required to release only after CI and Security Audit pass
  # on main. The job below only accepts successful push runs from this
  # repository (never a fork or pull request), and the reusable workflow
  # checks out and releases the commit those runs tested, executing no code
  # from the triggering run.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: ["CI", "Security Audit"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      version_bump:
        description: Version bump type
        required: true
        default: auto
        type: choice
        options:
          - auto
          - patch
          - minor
          - major
      dry_run:
        description: Report the next release without creating a commit, tag, GitHub Release or downstream run
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  verify-source:
    name: Verify release proposal source
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      ready: ${{ steps.source.outputs.ready }}
    steps:
      - name: Check out the workflow and default-branch history
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify source for a write-capable release
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          RELEASE_AUTHOR: ${{ vars.TF_AUTOMATION_APP_ID != '' && 'threatflux-automation[bot]' || 'github-actions[bot]' }}
        run: |
          set -euo pipefail
          if [[ "$DRY_RUN" == true ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$GITHUB_REF" != refs/heads/main ]]; then
            echo "Write-capable releases must target main." >&2
            exit 1
          fi
          main_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$SOURCE_SHA" != "$main_sha" ]]; then
            echo "Skipping release because main has moved."
            exit 0
          fi
          bash scripts/check_release_source.sh "$SOURCE_SHA" "$RELEASE_AUTHOR"
          echo "ready=true" >> "$GITHUB_OUTPUT"

  release:
    needs: verify-source
    if: needs.verify-source.outputs.ready == 'true'
    # The ceiling for the reusable workflow's jobs. With the automation App the
    # release commit, tag and GitHub release are written with the App token;
    # GITHUB_TOKEN keeps these scopes only for the no-App fallback.
    permissions:
      actions: write # Dispatch release.yml on the GITHUB_TOKEN fallback path.
      contents: write # Version bump commit, tag and GitHub release on the fallback path.
      pull-requests: write # Release pull requests in create-pr mode.
    uses: ThreatFlux/github_actions/.github/workflows/reusable-auto-release.yml@4b82a749e7479114c3335dd2806bb24f1b71cfe8 # reviewed release correction and signed runtime pin
    with:
      bump: ${{ github.event.inputs.version_bump || 'auto' }}
      # Only a manual dispatch can request a dry run; workflow_run always releases.
      dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
      create-pr: true
      release-branch: automation/release
      required-workflows: ci.yml,security.yml
      # The ThreatFlux automation App cuts the release, so its tag push starts
      # release.yml (on: push: tags) by itself and the reusable workflow skips
      # the explicit dispatch. dispatch-workflows only runs when no App is
      # configured and the release is cut with GITHUB_TOKEN, whose tag push
      # starts nothing.
      dispatch-workflows: release.yml
      dispatch-version-workflow: release.yml
      github-app-id: ${{ vars.TF_AUTOMATION_APP_ID }}
    secrets:
      github-app-private-key: ${{ secrets.TF_AUTOMATION_APP_PRIVATE_KEY }}
