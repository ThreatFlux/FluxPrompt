name: "CodeQL"

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  schedule:
    - cron: '30 1 * * 1'  # Weekly on Monday at 1:30 AM UTC

concurrency:
  # Supersede outdated pull request runs. Every other run gets its own group,
  # so no push to main is cancelled or dropped: Auto Release needs a finished
  # run for each main commit.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  RUSTUP_TOOLCHAIN: "1.99.0"

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read # Read workflow run metadata for the analysis.
      contents: read # Check out the repository.
      security-events: write # Upload CodeQL results to code scanning.

    strategy:
      fail-fast: false
      matrix:
        language: ['rust']

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.99.0

      - name: Verify selected Rust compiler
        run: |
          rustup show active-toolchain
          rustc --version --verbose
          cargo --version

      - name: Initialize CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - name: Build
        run: cargo build --locked

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: "/language:${{matrix.language}}"
