---
version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "cron"
      cronjob: "0 6 * * *"
    open-pull-requests-limit: 10
    # Give new versions time to settle. Security updates have no cooldown.
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
      - "rust"
    groups:
      compatible-updates:
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "chore"
      include: "scope"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "cron"
      cronjob: "0 6 * * *"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      action-updates:
        patterns:
          - "*"
    commit-message:
      prefix: "ci"
      include: "scope"
