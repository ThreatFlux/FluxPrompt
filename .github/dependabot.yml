---
version: 2
multi-ecosystem-groups:
  nightly-dependencies:
    open-pull-requests-limit: 1
    schedule:
      interval: "cron"
      cronjob: "0 6 * * *"
    commit-message:
      prefix: "chore"
      include: "scope"

updates:
  - package-ecosystem: "cargo"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "nightly-dependencies"
    # Give new versions time to settle. Security updates have no cooldown.
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
      - "rust"

  - package-ecosystem: "github-actions"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "nightly-dependencies"
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
      - "github-actions"
