# Configuration for cargo-deny
# More info: https://github.com/EmbarkStudios/cargo-deny

[graph]
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "x86_64-pc-windows-msvc" },
    { triple = "x86_64-apple-darwin" },
    { triple = "aarch64-apple-darwin" },
]

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
ignore = []

[licenses]
# List of allowed licenses
allow = [
    "MIT",
    "Apache-2.0",
    "Unicode-3.0",  # Required by unicode-ident crate
]
confidence-threshold = 0.8
exceptions = []

[[licenses.clarify]]
name = "ring"
version = "*"
expression = "MIT AND ISC AND OpenSSL"
license-files = [
    { path = "LICENSE", hash = 0xbd0eed23 }
]

[bans]
multiple-versions = "deny"
wildcards = "deny"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"

# Deny specific crates
deny = [
    # Examples of problematic crates
    # { name = "openssl", version = "*" },  # Prefer native-tls or rustls
]

# Required transitive version splits. Keep these exact so new duplication fails CI.
skip = [
    { name = "hashbrown", version = "0.14.5", reason = "dashmap 6 uses hashbrown 0.14 while indexmap uses 0.17" },
    { name = "syn", version = "2.0.119", reason = "several stable proc-macro dependencies have not migrated to syn 3" },
]

# Similarly named crates that are allowed to coexist
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
